[build]
  publish = "."

[[redirects]]
  from = "https://www.velonify.de/*"
  to = "https://velonify.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ueber-uns/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/about/*"
  to = "/en/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
