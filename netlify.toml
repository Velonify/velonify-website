[build]
  publish = "."

# submission-created leitet Formular-Anfragen ans CRM weiter
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "https://www.velonify.de/*"
  to = "https://velonify.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_ressourcen/*"
  to = "/404.html"
  status = 404
  force = true

# Lead-Magnete: es gibt nur die Seiten der einzelnen Magnete, keine Übersicht
[[redirects]]
  from = "/ressourcen/"
  to = "/"
  status = 302

[[redirects]]
  from = "/_ratgeber/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ueber-uns/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/about/*"
  to = "/en/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Lead-Magnete: Seiten nach dem Formular und die Mail-Links gehören nicht in den Suchindex
[[headers]]
  for = "/ressourcen/*"
  [headers.values]
    X-Robots-Tag = "noindex"
